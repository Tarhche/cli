name: Release

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Nothing a release ships is restored from a cache another run wrote.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read GoReleaser's version from the Dockerfile
        id: tools
        run: |
          version=$(sed -n 's|^FROM goreleaser/goreleaser:\(v[0-9.]*\).*|\1|p' Dockerfile)
          echo "goreleaser=${version:?the Dockerfile names no goreleaser/goreleaser image}" >> "$GITHUB_OUTPUT"

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ steps.tools.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
