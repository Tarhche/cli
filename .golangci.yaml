# golangci-lint v2: make lint in the develop container, and CI's lint job,
# both on the version the Dockerfile's golangci-lint stage names.
version: "2"

run:
  build-tags:
    - purego
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - paralleltest
    - revive
    - testifylint
    - unconvert
    - usestdlibvars
    - usetesting
  settings:
    gosec:
      excludes:
        # integer conversions, nearly always of sizes and counts already bounded
        - G115
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        # a method satisfying an interface takes what the interface gives it
        - name: unused-parameter
          disabled: true
    testifylint:
      disable:
        # output is compared as it is written, its spacing and escaping among it
        - encoded-compare
        # assert goes on to the checks after a failed one, which is often wanted
        - require-error
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
    paths:
      - frontend/node_modules

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Tarhche/cli
  exclusions:
    generated: lax
    paths:
      - frontend/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
